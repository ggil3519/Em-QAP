<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Em QAP - Rádio e Mapa Motoboy</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #111827; color: #fff; width: 100%; height: 100vh; overflow: hidden; }
    
    #tela-login { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #111827; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    #tela-login h1 { font-size: 32px; color: #f59e0b; margin-bottom: 8px; }
    #tela-login p { color: #9ca3af; font-size: 14px; margin-bottom: 20px; max-width: 320px; }
    .card-plano { background: #1f2937; border: 2px solid #f59e0b; border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; }
    .preco { font-size: 28px; font-weight: bold; color: #10b981; margin: 8px 0; }
    input.campo { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 16px; margin-bottom: 12px; }
    .btn-entrar { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #f59e0b; color: #111827; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; -webkit-appearance: none; }
    .btn-pix { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #10b981; background: transparent; color: #10b981; font-size: 14px; font-weight: bold; cursor: pointer; }

    #app-container { display: none; flex-direction: column; width: 100%; height: 100vh; }
    header { background: #1f2937; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f59e0b; height: 56px; }
    header h1 { font-size: 18px; color: #f59e0b; }
    .controles-topo { display: flex; gap: 6px; align-items: center; }
    select#canal-regiao { background: #111827; color: #fff; border: 1px solid #4b5563; padding: 6px; border-radius: 8px; font-size: 12px; }
    #btn-handsfree { background: #374151; color: #d1d5db; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    #btn-handsfree.ativo { background: #059669; color: #fff; border-color: #34d399; }
    
    #map { flex: 1; width: 100%; min-height: 200px; background: #1e293b; z-index: 1; }
    
    .alertas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; background: #1f2937; }
    .btn-alerta { border: none; border-radius: 8px; padding: 10px 4px; font-weight: bold; font-size: 11px; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .blitz { background: #2563eb; }
    .acidente { background: #d97706; }
    .perigo { background: #7c3aed; }
    .sos { background: #dc2626; }
    
    .radio-area { background: #111827; padding: 10px 12px 20px; border-top: 1px solid #374151; display: flex; flex-direction: column; gap: 8px; }
    #ptt-btn { width: 100%; height: 82px; border-radius: 16px; border: 3px solid #f59e0b; background: #1f2937; color: #f59e0b; font-size: 18px; font-weight: bold; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
    #ptt-btn.falando { background: #dc2626; border-color: #fca5a5; color: #fff; }
    #log-voz { text-align: center; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>

  <div id="tela-login">
    <h1>🏍️ EM QAP</h1>
    <p>Rádio PX ao vivo no Bluetooth e alertas de rota em tempo real para motoboys.</p>
    
    <div class="card-plano">
      <div style="font-size: 13px; color: #f59e0b; font-weight: bold;">ASSINATURA MENSAL</div>
      <div class="preco">R$ 25,00 <span style="font-size: 14px; color: #9ca3af;">/mês</span></div>
      <div style="font-size: 12px; color: #d1d5db; margin-bottom: 14px;">✔ Rádio ao vivo sem digitar<br>✔ Alertas de Blitz, Perigo e SOS no fone<br>✔ Mapa com colegas na região</div>
      
      <input type="text" id="input-nome" class="campo" placeholder="Seu nome ou QRA (Ex: Gil - Paulista)" />
      
      <button type="button" class="btn-entrar" onclick="document.getElementById('tela-login').style.display='none'; document.getElementById('app-container').style.display='flex'; setTimeout(iniciarSistema, 100);">
        ENTRAR NA FREQUÊNCIA (TESTE GRÁTIS)
      </button>
      
      <button type="button" class="btn-pix" onclick="alert('Chave Pix para assinatura (R$ 25,00): SUA_CHAVE_PIX_AQUI@email.com')">
        💠 PAGAR R$ 25 VIA PIX (COPIAR CHAVE)
      </button>
    </div>
  </div>

  <div id="app-container">
    <header>
      <h1>🏍️ EM QAP</h1>
      <div class="controles-topo">
        <select id="canal-regiao" onchange="mudarRegiao()">
          <option value="paulista-janga">📍 Paulista / Janga</option>
          <option value="olinda">📍 Olinda</option>
          <option value="recife-centro">📍 Recife Centro</option>
          <option value="geral-pe">📍 Geral Grande Recife</option>
        </select>
        <button type="button" id="btn-handsfree" onclick="ligarVozAuto()">🎧 VOZ AUTO: OFF</button>
      </div>
    </header>

    <div id="map"></div>

    <div class="alertas">
      <button type="button" class="btn-alerta blitz" onclick="mandarAlerta('BLITZ NA VIA')">🚓<span>BLITZ</span></button>
      <button type="button" class="btn-alerta acidente" onclick="mandarAlerta('ACIDENTE NA VIA')">⚠️<span>ACIDENTE</span></button>
      <button type="button" class="btn-alerta perigo" onclick="mandarAlerta('ÁREA DE RISCO')">🚨<span>PERIGO</span></button>
      <button type="button" class="btn-alerta sos" onclick="mandarAlerta('PEDIDO DE SOS URGENTE')">🆘<span>SOS</span></button>
    </div>

    <div class="radio-area">
      <div id="log-voz">Segure o botão ou ligue a Voz Auto no fone Bluetooth</div>
      <button type="button" id="ptt-btn">🎙️ SEGURE PARA FALAR (QAP)</button>
    </div>
  </div>

  <script src="https://unpkg.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script>
    var meuNome = 'Motoboy-' + Math.floor(100 + Math.random() * 900);
    var minhaPos = [-7.9408, -34.8731];
    var map = null;
    var meuMarcador = null;
    var outrosMarcadores = {};
    var supabaseClient = null;
    var canal = null;

    function falarAviso(texto) {
      try {
        if ('speechSynthesis' in window) {
          var fala = new SpeechSynthesisUtterance(texto);
          fala.lang = 'pt-BR';
          window.speechSynthesis.speak(fala);
        }
      } catch (e) {}
    }

    function iniciarSistema() {
      var campo = document.getElementById('input-nome');
      if (campo && campo.value.trim() !== '') {
        meuNome = campo.value.trim();
      }

      try {
        if (!map && typeof L !== 'undefined') {
          map = L.map('map').setView(minhaPos, 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
          }).addTo(map);
          meuMarcador = L.marker(minhaPos).addTo(map).bindPopup('<b>Você (' + meuNome + ')</b>').openPopup();
          setTimeout(function() { map.invalidateSize(); }, 300);
        }
      } catch (e) {}

      try {
        if (!supabaseClient && typeof supabase !== 'undefined') {
          supabaseClient = supabase.createClient(
            'https://supabase.co',
            'sb_publishable_q3jWuk-hxTtE3jwabRS_DA_HQQG3fZi'
          );
          conectarCanal('paulista-janga');
        }
      } catch (e) {}

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function(pos) {
          minhaPos = [pos.coords.latitude, pos.coords.longitude];
          if (meuMarcador) meuMarcador.setLatLng(minhaPos);
          if (map) map.setView(minhaPos);
          if (canal) {
            canal.send({
              type: 'broadcast',
              event: 'gps',
              payload: { autor: meuNome, lat: minhaPos, lng: minhaPos }
            });
          }
        });
      }
    }

    function conectarCanal(regiao) {
      if (!supabaseClient) return;
      if (canal) supabaseClient.removeChannel(canal);

      canal = supabaseClient.channel('qap-' + regiao, {
        config: { broadcast: { self: false } }
      });

      canal.on('broadcast', { event: 'voz' }, function(msg) {
        var p = msg.payload;
        document.getElementById('log-voz').innerText = '🔊 ' + p.autor + ' falando agora...';
        var audio = new Audio(p.audioBase64);
        audio.play().catch(function() {});
        audio.onended = function() {
          document.getElementById('log-voz').innerText = 'Frequência livre - Pode falar';
        };
      });

      canal.on('broadcast', { event: 'alerta' }, function(msg) {
        var p = msg.payload;
        if (map && typeof L !== 'undefined') {
          L.marker([p.lat, p.lng]).addTo(map).bindPopup('<b>' + p.tipo + '</b><br>Por: ' + p.autor).openPopup();
        }
        falarAviso('Atenção QAP! ' + p.autor + ' informou: ' + p.tipo);
      });

      canal.on('broadcast', { event: 'gps' }, function(msg) {
        var p = msg.payload;
        if (!map || typeof L === 'undefined') return;
        if (!outrosMarcadores[p.autor]) {
          outrosMarcadores[p.autor] = L.marker([p.lat, p.lng]).addTo(map).bindPopup('🏍️ ' + p.autor);
        } else {
          outrosMarcadores[p.autor].setLatLng([p.lat, p.lng]);
        }
      });

      canal.subscribe();
    }

    function mudarRegiao() {
      var reg = document.getElementById('canal-regiao').value;
      conectarCanal(reg);
      document.getElementById('log-voz').innerText = 'Canal: ' + reg.toUpperCase();
    }

    function mandarAlerta(tipo) {
