<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Em QAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    html, body { background: #111827; color: #fff; width: 100%; height: 100%; overflow: hidden; }
    #login { position: fixed; inset: 0; background: #111827; z-index: 99; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    .box { background: #1f2937; border: 2px solid #f59e0b; border-radius: 16px; padding: 20px; width: 100%; max-width: 330px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 16px; margin: 12px 0; }
    .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #f59e0b; color: #111827; font-size: 16px; font-weight: bold; cursor: pointer; }
    #app { display: none; flex-direction: column; width: 100%; height: 100%; }
    header { background: #1f2937; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f59e0b; }
    select, .btop { background: #111827; color: #fff; border: 1px solid #4b5563; padding: 6px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .on { background: #059669 !important; border-color: #34d399 !important; }
    #bar { background: #064e3b; color: #6ee7b7; font-size: 11px; padding: 5px 12px; display: flex; justify-content: space-between; font-weight: bold; }
    #radar-area { flex: 1; width: 100%; background: #0f172a; position: relative; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .radar-topo { text-align: center; padding: 12px; border: 1px dashed #374151; border-radius: 12px; background: #1f2937; }
    .tag-alerta { background: #1f2937; border-left: 4px solid #f59e0b; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .tag-alerta a { color: #38bdf8; font-size: 11px; text-decoration: none; border: 1px solid #38bdf8; padding: 4px 8px; border-radius: 6px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 6px; background: #1f2937; }
    .al { border: none; border-radius: 8px; padding: 10px 2px; font-weight: bold; font-size: 11px; color: #fff; cursor: pointer; }
    .radio { background: #111827; padding: 10px 12px 18px; border-top: 1px solid #374151; }
    #ptt { width: 100%; height: 80px; border-radius: 14px; border: 3px solid #f59e0b; background: #1f2937; color: #f59e0b; font-size: 18px; font-weight: bold; user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; }
    #ptt.rec { background: #dc2626; color: #fff; border-color: #fca5a5; }
    #log { text-align: center; font-size: 12px; color: #fbbf24; margin-bottom: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="login">
    <h1 style="color:#f59e0b;margin-bottom:10px;">EM QAP</h1>
    <div class="box">
      <div style="color:#10b981;font-size:24px;font-weight:bold;">R$ 25,00 /mes</div>
      <div style="font-size:12px;color:#9ca3af;margin-top:4px;">Radio PX Bluetooth + Alertas ao Vivo</div>
      <input type="text" id="nome" placeholder="Digite seu Nome ou QRA *" />
      <button type="button" class="btn" onclick="if(!document.getElementById('nome').value.trim()){alert('Digite seu Nome ou QRA!');return;} document.getElementById('login').style.display='none'; document.getElementById('app').style.display='flex'; iniciarRadio();">
        ENTRAR NA FREQUENCIA
      </button>
    </div>
  </div>

  <div id="app">
    <header>
      <b style="color:#f59e0b;">EM QAP</b>
      <div>
        <select id="reg" onchange="conectarWS()">
          <option value="paulista">Paulista/Janga</option>
          <option value="olinda">Olinda</option>
          <option value="recife">Recife</option>
        </select>
        <button type="button" id="beco" class="btop" onclick="eco=!eco;this.classList.toggle('on',eco)">ECO</button>
        <button type="button" id="bauto" class="btop" onclick="ligarAuto()">AUTO: OFF</button>
      </div>
    </header>
    <div id="bar"><span id="st">Conectando...</span><span id="gps-txt">Janga / Paulista</span></div>
    <div id="radar-area">
      <div class="radar-topo">
        <div style="color:#10b981;font-size:13px;font-weight:bold;">RADAR DE ROTAS E ALERTAS AO VIVO</div>
        <div id="coord-txt" style="color:#9ca3af;font-size:11px;margin-top:4px;">Aguardando alertas da galera na frequencia...</div>
      </div>
      <div id="feed-alertas" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>
    <div class="grid">
      <button type="button" class="al" style="background:#2563eb" onclick="mandarAlerta('BLITZ NA VIA')">BLITZ</button>
      <button type="button" class="al" style="background:#d97706" onclick="mandarAlerta('ACIDENTE NA VIA')">ACIDENTE</button>
      <button type="button" class="al" style="background:#7c3aed" onclick="mandarAlerta('AREA DE RISCO')">PERIGO</button>
      <button type="button" class="al" style="background:#dc2626" onclick="mandarAlerta('PEDIDO DE SOS')">SOS</button>
    </div>
    <div class="radio">
      <div id="log">Segure o botao ou ligue o AUTO</div>
      <button type="button" id="ptt" onmousedown="startRec(event)" onmouseup="stopRec(event)" ontouchstart="startRec(event)" ontouchend="stopRec(event)">SEGURE PARA FALAR</button>
    </div>
  </div>

  <audio id="aud" playsinline></audio>

  <script>
    var URL_SUPA = "wdezbueowxzrtxdzxrph.supabase.co";
    var KEY_SUPA = "sb_publishable_q3jWuk-hxTtE3jwabRS_DA_HQQG3fZi";
    var nome = "";
    var lat = -7.945;
    var lng = -34.880;
    var ws = null;
    var pingTm = null;
    var eco = false;
    var auto = false;
    var rec = null;
    var chunks = [];
    var strm = null;
    var ref = 1;

    function iniciarRadio() {
      nome = document.getElementById("nome").value.trim();
      var aud = document.getElementById("aud");
      if (aud) aud.play().catch(function(){});
      conectarWS();
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function(p) {
          lat = p.coords.latitude;
          lng = p.coords.longitude;
          document.getElementById("gps-txt").innerText = "GPS Ativo";
          document.getElementById("coord-txt").innerText = "Sua posicao: " + lat.toFixed(4) + ", " + lng.toFixed(4);
        });
      }
    }

    function mandarAlerta(t) {
      mostrarTag(t + " - por Voce", lat, lng);
      enviarWS("al", { n: nome, t: t, la: lat, ln: lng });
      document.getElementById("log").innerText = "Enviado: " + t;
    }

    function mostrarTag(texto, la, ln) {
      var feed = document.getElementById("feed-alertas");
      var div = document.createElement("div");
      div.className = "tag-alerta";
      var link = (la && ln) ? "<a href='https://google.com" + la + "," + ln + "' target='_blank'>VER NO MAPA</a>" : "";
      div.innerHTML = "<span>" + texto + "</span>" + link;
      feed.prepend(div);
      if (feed.children.length > 6) feed.removeChild(feed.lastChild);
    }

    function conectarWS() {
      if (ws) { try { ws.close(); } catch(e){} }
      clearInterval(pingTm);
      document.getElementById("st").innerText = "Conectando radio...";
      var canal = "realtime:qap-" + document.getElementById("reg").value;
      ws = new WebSocket("wss://" + URL_SUPA + "/realtime/v1/websocket?apikey=" + KEY_SUPA + "&vsn=1.0.0");

      ws.onopen = function() {
        ws.send(JSON.stringify({
          topic: canal,
          event: "phx_join",
          payload: { config: { broadcast: { self: true } } },
          ref: String(ref++)
        }));
        document.getElementById("st").innerText = "RADIO CONECTADO AO VIVO";
        pingTm = setInterval(function() {
          if (ws.readyState === 1) ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(ref++) }));
        }, 25000);
      };

      ws.onmessage = function(ev) {
        var d = JSON.parse(ev.data);
        if (d.event === "broadcast" && d.payload && d.payload.payload) {
          var p = d.payload.payload;
          if (p.n === nome && !eco) return;
          if (d.payload.event === "voz") {
            document.getElementById("log").innerText = "OUVINDO: " + p.n;
            mostrarTag("Audio de " + p.n);
            var a = document.getElementById("aud");
            a.src = p.b;
            a.play().catch(function(){});
            a.onended = function() { document.getElementById("log").innerText = "Frequencia livre"; };
          }
          if (d.payload.event === "al") {
            mostrarTag(p.t + " - por " + p.n, p.la, p.ln);
            document.getElementById("log").innerText = p.t + " (" + p.n + ")";
            try {
              var f = new SpeechSynthesisUtterance("Atencao QAP! " + p.n + " informou: " + p.t);
              f.lang = "pt-BR";
              speechSynthesis.speak(f);
            } catch(e){}
          }
        }
      };

      ws.onerror = function() { document.getElementById("st").innerText = "Erro de rede"; };
    }

    function enviarWS(evento, dados) {
      if (!ws || ws.readyState !== 1) return;
      var canal = "realtime:qap-" + document.getElementById("reg").value;
      ws.send(JSON.stringify({
        topic: canal,
        event: "broadcast",
        payload: { type: "broadcast", event: evento, payload: dados },
        ref: String(ref++)
      }));
    }

    function startRec(e) {
      if (e) e.preventDefault();
      if (rec && rec.state === "recording") return;
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(s) {
        if (auto) strm = s;
        rec = new MediaRecorder(s);
