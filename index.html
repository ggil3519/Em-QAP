<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Em QAP - Rádio e Mapa Motoboy</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background: #111827; color: #fff; overflow: hidden; }
    
    /* TELA DE ACESSO / ASSINATURA R$ 25 */
    #tela-login { position: fixed; inset: 0; background: #111827; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    #tela-login h1 { font-size: 32px; color: #f59e0b; margin-bottom: 8px; }
    #tela-login p { color: #9ca3af; font-size: 14px; margin-bottom: 20px; max-width: 320px; }
    .card-plano { background: #1f2937; border: 2px solid #f59e0b; border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; margin-bottom: 16px; }
    .preco { font-size: 28px; font-weight: bold; color: #10b981; margin: 8px 0; }
    input.campo { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #fff; font-size: 16px; margin-bottom: 12px; }
    .btn-entrar { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #f59e0b; color: #111827; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-pix { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #10b981; background: transparent; color: #10b981; font-size: 14px; font-weight: bold; cursor: pointer; }

    /* TELA PRINCIPAL DO APP */
    #app-container { display: none; flex-direction: column; width: 100%; height: 100%; }
    header { background: #1f2937; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f59e0b; height: 56px; }
    header h1 { font-size: 18px; color: #f59e0b; }
    .controles-topo { display: flex; gap: 6px; align-items: center; }
    select#canal-regiao { background: #111827; color: #fff; border: 1px solid #4b5563; padding: 6px; border-radius: 8px; font-size: 12px; }
    #btn-handsfree { background: #374151; color: #d1d5db; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    #btn-handsfree.ativo { background: #059669; color: #fff; border-color: #34d399; }
    
    #map { flex: 1; width: 100%; min-height: 200px; background: #1e293b; z-index: 1; }
    
    .alertas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; background: #1f2937; }
    .btn-alerta { border: none; border-radius: 8px; padding: 10px 4px; font-weight: bold; font-size: 11px; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .blitz { background: #2563eb; }
    .acidente { background: #d97706; }
    .perigo { background: #7c3aed; }
    .sos { background: #dc2626; animation: pulse 2s infinite; }
    
    .radio-area { background: #111827; padding: 10px 12px 18px; border-top: 1px solid #374151; display: flex; flex-direction: column; gap: 8px; }
    #ptt-btn { width: 100%; height: 82px; border-radius: 16px; border: 3px solid #f59e0b; background: #1f2937; color: #f59e0b; font-size: 18px; font-weight: bold; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
    #ptt-btn.falando { background: #dc2626; border-color: #fca5a5; color: #fff; }
    #log-voz { text-align: center; font-size: 12px; color: #9ca3af; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- TELA 1: LOGIN E PLANO R$ 25/MÊS -->
  <div id="tela-login">
    <h1>🏍️ EM QAP</h1>
    <p>Rádio PX ao vivo no Bluetooth e alertas de rota em tempo real para motoboys.</p>
    
    <div class="card-plano">
      <div style="font-size: 13px; color: #f59e0b; font-weight: bold;">ASSINATURA MENSAL</div>
      <div class="preco">R$ 25,00 <span style="font-size: 14px; color: #9ca3af;">/mês</span></div>
      <div style="font-size: 12px; color: #d1d5db; margin-bottom: 14px;">✔ Rádio ao vivo sem digitar<br>✔ Alertas de Blitz, Perigo e SOS no fone<br>✔ Mapa com colegas na região</div>
      
      <input type="text" id="input-nome" class="campo" placeholder="Seu nome ou QRA (Ex: Gil - Paulista)" />
      <button class="btn-entrar" onclick="entrarNoApp()">ENTRAR NA FREQUÊNCIA (TESTE GRÁTIS)</button>
      <button class="btn-pix" onclick="copiarPix()">💠 PAGAR R$ 25 VIA PIX (COPIAR CHAVE)</button>
    </div>
  </div>

  <!-- TELA 2: RÁDIO E MAPA AO VIVO -->
  <div id="app-container">
    <header>
      <h1>🏍️ EM QAP</h1>
      <div class="controles-topo">
        <select id="canal-regiao" onchange="trocarCanal()">
          <option value="paulista-janga">📍 Paulista / Janga</option>
          <option value="olinda">📍 Olinda</option>
          <option value="recife-centro">📍 Recife Centro</option>
          <option value="geral-pe">📍 Geral Grande Recife</option>
        </select>
        <button id="btn-handsfree" onclick="alternarMaosLivres()">🎧 VOZ AUTO: OFF</button>
      </div>
    </header>

    <div id="map"></div>

    <div class="alertas">
      <button class="btn-alerta blitz" onclick="enviarAlerta('BLITZ NA VIA')">🚓<span>BLITZ</span></button>
      <button class="btn-alerta acidente" onclick="enviarAlerta('ACIDENTE NA VIA')">⚠️<span>ACIDENTE</span></button>
      <button class="btn-alerta perigo" onclick="enviarAlerta('ÁREA DE RISCO')">🚨<span>PERIGO</span></button>
      <button class="btn-alerta sos" onclick="enviarAlerta('PEDIDO DE SOS URGENTE')">🆘<span>SOS</span></button>
    </div>

    <div class="radio-area">
      <div id="log-voz">Segure o botão ou ligue a Voz Auto no fone Bluetooth</div>
      <button id="ptt-btn">🎙️ SEGURE PARA FALAR (QAP)</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_q3jWuk-hxTtE3jwabRS_DA_HQQG3fZi';
    let supabaseClient = null;
    let canal = null;
    let map = null;
    let meuMarcador = null;
    const outrosMarcadores = {};
    let meuNome = 'Motoboy-' + Math.floor(100 + Math.random() * 900);
    let minhaPos = [-7.9408, -34.8731]; // Paulista / Janga - PE

    function copiarPix() {
      // Substitua abaixo pela sua chave Pix real quando quiser cobrar!
      const chavePix = "SUA_CHAVE_PIX_AQUI@email.com";
      navigator.clipboard.writeText(chavePix).then(() => {
        alert("Chave Pix copiada! Faça o Pix de R$ 25,00 e envie o comprovante para liberar seu acesso mensal.");
      }).catch(() => {
        alert("Chave Pix para assinatura (R$ 25,00): " + chavePix);
      });
    }

    function entrarNoApp() {
      const nomeDigitado = document.getElementById('input-nome').value.trim();
      if (nomeDigitado) meuNome = nomeDigitado;

      document.getElementById('tela-login').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';

      // Libera o áudio no celular no primeiro clique
      const destravaAudio = new SpeechSynthesisUtterance("Frequência Em QAP ativada.");
      destravaAudio.lang = 'pt-BR';
      window.speechSynthesis.speak(destravaAudio);

      iniciarMapaERadio();
    }

    function iniciarMapaERadio() {
      if (!map) {
        map = L.map('map').setView(minhaPos, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap',
          maxZoom: 19
        }).addTo(map);
        meuMarcador = L.marker(minhaPos).addTo(map).bindPopup(`<b>Você (${meuNome})</b>`).openPopup();
      }
      setTimeout(() => { map.invalidateSize(); }, 300);

      if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      conectarCanal(document.getElementById('canal-regiao').value);

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          minhaPos = [pos.coords.latitude, pos.coords.longitude];
          if (meuMarcador) meuMarcador.setLatLng(minhaPos);
          if (map) map.setView(minhaPos);
          if (canal) {
            canal.send({
              type: 'broadcast',
              event: 'gps',
              payload: { autor: meuNome, lat: minhaPos[0], lng: minhaPos[1] }
            });
          }
        }, null, { enableHighAccuracy: true });
      }
    }

    function conectarCanal(nomeCanal) {
      if (!supabaseClient) return;
      if (canal) supabaseClient.removeChannel(canal);

      canal = supabaseClient.channel('qap-' + nomeCanal, {
        config: { broadcast: { self: false } }
      });

      canal.on('broadcast', { event: 'voz' }, ({ payload }) => {
        document.getElementById('log-voz').innerText = `🔊 ${payload.autor} falando agora...`;
        const audio = new Audio(payload.audioBase64);
        audio.play().catch(() => {});
        audio.onended = () => {
          document.getElementById('log-voz').innerText = 'Frequência livre - Pode falar';
        };
      });

      canal.on('broadcast', { event: 'alerta' }, ({ payload }) => {
        if (map) {
          L.marker([payload.lat, payload.lng]).addTo(map)
            .bindPopup(`<b>${payload.tipo}</b><br>Por: ${payload.autor}`).openPopup();
        }
        const fala = new SpeechSynthesisUtterance(`Atenção QAP! ${payload.autor} informou: ${payload.tipo}.`);
        fala.lang = 'pt-BR';
        window.speechSynthesis.speak(fala);
      });
