<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Em QAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #111827; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    #login { position: fixed; inset: 0; background: #111827; z-index: 99; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    .box { background: #1f2937; border: 2px solid #f59e0b; border-radius: 16px; padding: 20px; width: 100%; max-width: 330px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 16px; margin: 12px 0; }
    .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #f59e0b; color: #111827; font-size: 16px; font-weight: bold; cursor: pointer; }
    header { background: #1f2937; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f59e0b; }
    select, .btop { background: #111827; color: #fff; border: 1px solid #4b5563; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .on { background: #059669 !important; border-color: #34d399 !important; }
    #bar { background: #064e3b; color: #6ee7b7; font-size: 11px; padding: 5px 12px; display: flex; justify-content: space-between; font-weight: bold; }
    #feed { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #0f172a; }
    .tag { background: #1f2937; border-left: 4px solid #f59e0b; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .tag a { color: #38bdf8; font-size: 11px; text-decoration: none; border: 1px solid #38bdf8; padding: 4px 8px; border-radius: 6px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 6px; background: #1f2937; }
    .al { border: none; border-radius: 8px; padding: 12px 2px; font-weight: bold; font-size: 11px; color: #fff; cursor: pointer; }
    .radio { background: #111827; padding: 10px 12px 20px; border-top: 1px solid #374151; }
    #ptt { width: 100%; height: 80px; border-radius: 14px; border: 3px solid #f59e0b; background: #1f2937; color: #f59e0b; font-size: 18px; font-weight: bold; user-select: none; touch-action: none; cursor: pointer; }
    #ptt.rec { background: #dc2626; color: #fff; border-color: #fca5a5; }
    #log { text-align: center; font-size: 12px; color: #fbbf24; margin-bottom: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="login">
    <h1 style="color:#f59e0b;margin-bottom:10px;">EM QAP</h1>
    <div class="box">
      <div style="color:#10b981;font-size:24px;font-weight:bold;">R$ 25,00 /mes</div>
      <div style="font-size:12px;color:#9ca3af;margin-top:4px;">Radio PX Bluetooth + Alertas ao Vivo</div>
      <input type="text" id="nome" placeholder="Digite seu Nome ou QRA *" />
      <button type="button" class="btn" id="btn-in">ENTRAR NA FREQUENCIA</button>
    </div>
  </div>
  <header>
    <b style="color:#f59e0b;">EM QAP</b>
    <div>
      <select id="reg"><option value="paulista">Paulista/Janga</option><option value="olinda">Olinda</option><option value="recife">Recife</option></select>
      <button type="button" id="beco" class="btop">ECO</button>
      <button type="button" id="bauto" class="btop">AUTO: OFF</button>
    </div>
  </header>
  <div id="bar"><span id="st">Aguardando...</span><span id="gps">Janga / Paulista</span></div>
  <div id="feed"></div>
  <div class="grid">
    <button type="button" class="al" style="background:#2563eb" data-t="BLITZ NA VIA">BLITZ</button>
    <button type="button" class="al" style="background:#d97706" data-t="ACIDENTE NA VIA">ACIDENTE</button>
    <button type="button" class="al" style="background:#7c3aed" data-t="AREA DE RISCO">PERIGO</button>
    <button type="button" class="al" style="background:#dc2626" data-t="PEDIDO DE SOS">SOS</button>
  </div>
  <div class="radio">
    <div id="log">Segure o botao ou ligue o AUTO</div>
    <button type="button" id="ptt">SEGURE PARA FALAR</button>
  </div>
  <audio id="aud" playsinline></audio>
   <script>
    var nome="", lat=-7.945, lng=-34.880, es=null, eco=false, auto=false, rec, chunks=[], strm;
    function addTag(txt, la, ln){
      var d=document.createElement("div"); d.className="tag";
      d.innerHTML="<span>"+txt+"</span>"+(la?"<a href='https://google.com"+la+","+ln+"' target='_blank'>MAPA</a>":"");
      document.getElementById("feed").prepend(d);
    }
    function conn(){
      if(es) try{es.close();}catch(e){}
      document.getElementById("st").innerText="Conectando...";
      var canal="emqap_pe_2026_"+document.getElementById("reg").value;
      es=new EventSource("https://ntfy.sh"+canal+"/sse");
      es.onopen=function(){ document.getElementById("st").innerText="RADIO CONECTADO AO VIVO"; };
      es.onmessage=function(e){
        try{
          var m=JSON.parse(e.data);
          if(!m.message) return;
          var d=JSON.parse(m.message);
          if(d.n===nome && !eco) return;
          if(d.tp==="voz"){ document.getElementById("log").innerText="OUVINDO: "+d.n; addTag("Audio de "+d.n); var a=document.getElementById("aud"); a.src=d.b; a.play().catch(function(){}); a.onended=function(){document.getElementById("log").innerText="Frequencia livre";}; }
          if(d.tp==="al"){ addTag(d.t+" ("+d.n+")", d.la, d.ln); try{var f=new SpeechSynthesisUtterance(d.t); f.lang="pt-BR"; speechSynthesis.speak(f);}catch(x){} }
        }catch(x){}
      };
      es.onerror=function(){ document.getElementById("st").innerText="Reconectando..."; };
    }
    function send(o){
      o.n=nome;
      var canal="emqap_pe_2026_"+document.getElementById("reg").value;
      fetch("https://ntfy.sh"+canal, { method:"POST", body:JSON.stringify(o) }).catch(function(){});
    }
    document.getElementById("btn-in").onclick=function(){
      nome=document.getElementById("nome").value.trim();
      if(!nome){ alert("Digite seu Nome!"); return; }
      document.getElementById("login").style.display="none";
      document.getElementById("aud").play().catch(function(){});
      conn();
      if(navigator.geolocation) navigator.geolocation.watchPosition(function(p){ lat=p.coords.latitude; lng=p.coords.longitude; document.getElementById("gps").innerText="GPS Ativo"; });
    };
    document.getElementById("reg").onchange=conn;
    document.getElementById("beco").onclick=function(){ eco=!eco; this.classList.toggle("on",eco); };
    document.querySelectorAll(".al").forEach(function(b){ b.onclick=function(){ var t=this.getAttribute("data-t"); addTag(t+" (Voce)",lat,lng); send({tp:"al",t:t,la:lat,ln:lng}); }; });
    function sRec(e){ if(e)e.preventDefault(); if(rec&&rec.state==="recording")return; navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ if(auto)strm=s; rec=new MediaRecorder(s); chunks=[]; rec.ondataavailable=function(ev){if(ev.data.size>0)chunks.push(ev.data);}; rec.onstop=function(){ var r=new FileReader(); r.readAsDataURL(new Blob(chunks,{type:rec.mimeType||"audio/webm"})); r.onloadend=function(){send({tp:"voz",b:r.result});}; if(!auto)s.getTracks().forEach(function(t){t.stop();}); }; rec.start(); document.getElementById("ptt").classList.add("rec"); document.getElementById("log").innerText="TRANSMITINDO..."; }).catch(function(){alert("Libere o microfone!");}); }
    function eRec(e){ if(e)e.preventDefault(); if(rec&&rec.state==="recording"){ rec.stop(); document.getElementById("ptt").classList.remove("rec"); document.getElementById("log").innerText="Audio enviado!"; } }
    document.getElementById("bauto").onclick=function(){ auto=!auto; this.innerText=auto?"AUTO: ON":"AUTO: OFF"; this.classList.toggle("on",auto); if(auto){ navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ strm=s; var ctx=new(window.AudioContext||window.webkitAudioContext)(), an=ctx.createAnalyser(); an.fftSize=512; ctx.createMediaStreamSource(s).connect(an); var arr=new Uint8Array(an.frequencyBinCount), tm; (function loop(){ if(!auto)return; an.getByteFrequencyData(arr); var v=arr.reduce(function(a,b){return a+b;},0)/arr.length; if(v>25){ if(!rec||rec.state!=="recording")sRec(); clearTimeout(tm); tm=setTimeout(eRec,1200); } requestAnimationFrame(loop); })(); }); } else if(strm){ strm.getTracks().forEach(function(t){t.stop();}); } };
    var ptt=document.getElementById("ptt"); ptt.onmousedown=ptt.ontouchstart=sRec; ptt.onmouseup=ptt.ontouchend=eRec;
  </script>
</body>
</html>
